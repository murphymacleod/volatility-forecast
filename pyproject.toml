[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "volforecast"
version = "0.1.0"
description = "Volatility forecasting and backtesting for the club's commodity ETFs"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["volforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
